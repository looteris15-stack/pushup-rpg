<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pushup RPG startup bench</title>
<!-- Fight-to-ready timing with the real body-tracking library, WASM and model (from the internet).
     Run it with _tests\bench.ps1 (hidden Edge with a fake camera); it waits for the runner's "go". -->
<style>
  body { margin: 0; padding: 12px; font: 14px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
  iframe { width: 420px; height: 640px; border: 1px solid #444; background: #000; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="A" title="Game"></iframe>
<pre id="log"></pre>
<script type="module">
const LIB = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";
const WASM_DIR = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm/";
const MODEL = new URLSearchParams(location.search).get("model") || "full";
const MODEL_URL = `https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_${MODEL}/float16/1/pose_landmarker_${MODEL}.task`;
const SAVE = "pushupRPG.save.v1";
const BASE = {
  v: 1, rev: 1, savedAt: 0, xp: 50, restUntil: 0, dungeonLockedUntil: 0, dungeonFloor: 1, run: null, unlockedZones: 2,
  tested: true, testResult: 15, wandererDone: "", wanderToday: null, lastBackupAt: Date.now(), backupFights: 0, fightMark: null,
  kills: {}, losses: {}, history: [],
  stats: { pushups: 15, fights: 0, wins: 0, bestSet: 15, biggestKill: 0, deepestFloor: 0 },
  settings: { depth: 63, top: 160, bend: 20, knee: 135, strictV: 3, voice: false, sound: false, camera: "user", model: MODEL },
};
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms, what) {
  const end = Date.now() + ms;
  while (Date.now() < end) { try { const v = fn(); if (v) return v; } catch {} await wait(5); }
  throw new Error("timed out waiting for " + what);
}
const r1 = x => Math.round(x);

// opens the game and adds the measuring (it only watches: frames, long tasks, camera, inference)
async function load() {
  const el = document.getElementById("A");
  el.src = "about:blank"; await wait(200);
  el.src = `../app/?debug&b=${Date.now()}`;
  await until(() => el.contentWindow.PushupRPG && el.contentDocument.readyState === "complete", 60000, "the game");
  const w = el.contentWindow, d = el.contentDocument;
  const ins = { frames: 0, long: [], cam: [], attach: [], infer: [], loadedAt: w.performance.now() };
  const tick = () => { ins.frames++; w.requestAnimationFrame(tick); };
  w.requestAnimationFrame(tick);
  try { new w.PerformanceObserver(l => { for (const e of l.getEntries()) ins.long.push({ t: e.startTime, ms: e.duration }); }).observe({ type: "longtask", buffered: true }); } catch {}
  const gum = w.navigator.mediaDevices.getUserMedia.bind(w.navigator.mediaDevices);
  w.navigator.mediaDevices.getUserMedia = async c => { const s = await gum(c); ins.cam.push(w.performance.now()); return s; };
  ins.lock = [];
  if (w.navigator.wakeLock) {
    const ask = w.navigator.wakeLock.request.bind(w.navigator.wakeLock);
    w.navigator.wakeLock.request = async (...a) => { try { return await ask(...a); } finally { ins.lock.push({ t: w.performance.now(), frames: ins.frames }); } };
  }
  const v = d.querySelector("#video"), src = Object.getOwnPropertyDescriptor(w.HTMLMediaElement.prototype, "srcObject");
  Object.defineProperty(v, "srcObject", { configurable: true, get() { return src.get.call(this); },
    set(s) { if (s) ins.attach.push({ t: w.performance.now(), frames: ins.frames }); src.set.call(this, s); } });
  // inference timing: once the game has the library, wrap its detectForVideo (same module in this window)
  (async () => {
    await until(() => w.performance.getEntriesByName(LIB).length, 300000, "the library");
    const { PoseLandmarker } = await w.eval(`import(${JSON.stringify(LIB)})`);
    const det = PoseLandmarker.prototype.detectForVideo;
    PoseLandmarker.prototype.detectForVideo = function (...a) {
      const t0 = w.performance.now(), f = ins.frames;
      try { return det.apply(this, a); }
      finally { if (ins.infer.length < 400) ins.infer.push({ t: t0, ms: w.performance.now() - t0, frames: f }); }
    };
  })().catch(e => { ins.patchError = String(e); });
  return { w, d, ins };
}

// one Fight tap (Field Mouse) until the fight is ready; then 1.5 s of tracking, then Back
async function fight({ w, d, ins }) {
  w.PushupRPG.state.settings.model = MODEL;
  d.querySelector('[data-action="goto"][data-to="map"]').click();
  await until(() => d.querySelector('.mrow[data-id="field-mouse"]'), 3000, "the map");
  d.querySelector('.mrow[data-id="field-mouse"]').click();
  await until(() => [...d.querySelectorAll("#modal button")].find(x => /fight/i.test(x.textContent) && !x.disabled), 3000, "the Fight button");
  const b = [...d.querySelectorAll("#modal button")].find(x => /fight/i.test(x.textContent) && !x.disabled);
  const n = { infer: ins.infer.length, attach: ins.attach.length, cam: ins.cam.length, long: ins.long.length, lock: ins.lock.length };
  const t0 = w.performance.now(), sinceLoad = t0 - ins.loadedAt;
  b.click();
  window.__stage = "waiting for ready";
  const modal = () => !d.querySelector("#modal").hidden && /can't start/i.test(d.querySelector("#modal").textContent);
  await until(() => w.PushupRPG.fight || modal(), 300000, "the fight to be ready");
  const ready = w.performance.now() - t0, error = modal() ? d.querySelector("#modal").textContent.replace(/\s+/g, " ").trim().slice(0, 120) : "";
  await wait(1500);
  const rel = t => t == null ? null : r1(t - t0);
  const req = url => w.performance.getEntriesByName(url).map(e => ({ start: rel(e.startTime), end: rel(e.responseEnd), kB: Math.round(e.encodedBodySize / 1024) }));
  const infer = ins.infer.slice(n.infer), first = infer[0], attach = ins.attach.slice(n.attach).at(-1);
  const later = infer.slice(1).map(x => x.ms).sort((a, b) => a - b);
  const longs = ins.long.slice(n.long).filter(x => x.t >= t0 - 5 && x.t <= t0 + ready + 50).map(x => r1(x.ms)).sort((a, b) => b - a);
  const out = {
    sinceLoadMs: r1(sinceLoad), readyMs: r1(ready), error, delegate: w.PushupRPG.delegate,
    cameraMs: rel(ins.cam.slice(n.cam)[0]), attachMs: attach ? rel(attach.t) : null,
    firstInferAt: first ? rel(first.t) : null, firstInferMs: first ? r1(first.ms) : null,
    framesCameraToFirstInfer: first && attach ? first.frames - attach.frames : null,
    framesLockToFirstInfer: (() => { const l = ins.lock.slice(n.lock).filter(x => first && x.t <= first.t).at(-1); return l ? first.frames - l.frames : null; })(),
    laterInferMedianMs: later.length ? +later[Math.floor(later.length / 2)].toFixed(1) : null, laterInferMaxMs: later.length ? r1(later.at(-1)) : null,
    longTasksDuringStart: longs.slice(0, 6), longTaskTotalMs: longs.reduce((a, b) => a + b, 0),
    lib: req(LIB), wasmJs: req(WASM_DIR + "vision_wasm_internal.js"), wasm: req(WASM_DIR + "vision_wasm_internal.wasm"), model: req(MODEL_URL),
    patchError: ins.patchError || "",
  };
  d.querySelector("#btnFlee").click(); // Back (free: no rep yet)
  await wait(500);
  if (d.querySelector("#modal") && !d.querySelector("#modal").hidden) d.querySelector('#modal [data-action="closeModal"]')?.click();
  return out;
}

const log = document.getElementById("log");
while (!window.__go) await wait(50);
try {
  localStorage.clear();
  localStorage.setItem(SAVE, JSON.stringify(BASE));
  await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(BASE) }).catch(() => {});
  window.__stage = "loading the game";
  let g = await load();
  window.__g = g;
  window.__stage = "cold fight";
  const cold = await fight(g);          // nothing downloaded yet (fresh browser profile)
  window.__stage = "warm fight";
  const warm = await fight(g);          // same page: the ready model is reused
  window.__stage = "reloading";
  g = await load();                     // a new page: files come from the browser cache
  window.__g = g;
  window.__stage = "cached fight";
  const cached = await fight(g);
  window.__bench = { model: MODEL, cold, warm, cached };
} catch (e) { window.__bench = { error: String(e && e.stack || e) }; }
log.textContent = JSON.stringify(window.__bench, null, 1);
window.__benchDone = true;
</script>
</body>
</html>
